<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <!-- Forward pass, stage 2: EMBEDDINGS. token ID -> vector -> a point in meaning-space. 10s loop, SMIL. -->
  <defs>
    <marker id="head" markerWidth="4" markerHeight="4" refX="4" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#115E67"/>
    </marker>
  </defs>

  <text x="48" y="24" font-size="13" letter-spacing="2.5" fill="#154734" font-weight="700">HOW AN LLM WORKS &#183; EMBEDDINGS</text>

  <!-- pipeline rail (embeddings highlighted) -->
  <g font-size="13" font-weight="600">
    <rect x="48"  y="40" width="86"  height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="91"  y="58" text-anchor="middle" fill="#475569">tokens</text>
    <rect x="158" y="38" width="118" height="32" rx="6" fill="#D9E9EA" stroke="#115E67" stroke-width="2"/>
    <text x="217" y="58" text-anchor="middle" fill="#115E67">embeddings</text>
    <rect x="300" y="40" width="150" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="375" y="58" text-anchor="middle" fill="#475569">attention layers</text>
    <rect x="474" y="40" width="78"  height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="513" y="58" text-anchor="middle" fill="#475569">scores</text>
    <rect x="576" y="40" width="132" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="642" y="58" text-anchor="middle" fill="#475569">P(next token)</text>
    <g stroke="#CBD5E1" stroke-width="1.5" fill="none">
      <path d="M134,54 L156,54" marker-end="url(#head)"/>
      <path d="M276,54 L298,54" marker-end="url(#head)"/>
      <path d="M450,54 L472,54" marker-end="url(#head)"/>
      <path d="M552,54 L574,54" marker-end="url(#head)"/>
    </g>
    <rect x="158" y="38" width="118" height="32" rx="6" fill="none" stroke="#115E67" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;1" values="0;0.6;0"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;1" values="2;7;2"/>
    </rect>
  </g>
  <path d="M217,72 L217,90 M211,85 L217,90 L223,85" stroke="#115E67" stroke-width="2" fill="none"/>
  <text x="48" y="108" font-size="13" font-style="italic" fill="#94A3B8">each token &#8594; a vector &#8212; a point in a high-dimensional meaning-space</text>

  <!-- LEFT: token -> vector -->
  <text x="60" y="146" font-size="13" font-weight="600" fill="#475569">each token becomes a list of numbers</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16">
    <!-- cup -->
    <rect x="60" y="166" width="56" height="36" rx="6" fill="#D9E9EA" stroke="#115E67"/>
    <text x="88" y="190" text-anchor="middle" fill="#115E67" font-weight="700">cup</text>
    <path d="M120,184 L150,184" stroke="#CBD5E1" stroke-width="1.5" fill="none" marker-end="url(#head)"/>
    <text x="160" y="190" font-size="15" fill="#334155" opacity="0">[ 0.18, &#8722;0.42, 0.91, 0.05, &#8230; ]
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.10;0.22;0.92;1" values="0;0;1;1;0"/></text>
    <!-- mug -->
    <rect x="60" y="222" width="56" height="36" rx="6" fill="#D9E9EA" stroke="#115E67"/>
    <text x="88" y="246" text-anchor="middle" fill="#115E67" font-weight="700">mug</text>
    <path d="M120,240 L150,240" stroke="#CBD5E1" stroke-width="1.5" fill="none" marker-end="url(#head)"/>
    <text x="160" y="246" font-size="15" fill="#334155" opacity="0">[ 0.21, &#8722;0.39, 0.88, 0.07, &#8230; ]
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.16;0.28;0.92;1" values="0;0;1;1;0"/></text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.34;0.42;0.92;1" values="0;0;1;1;0"/>
    <path d="M150,200 C 140,212 140,228 150,240" stroke="#115E67" stroke-width="1.5" fill="none"/>
    <text x="160" y="284" font-size="14" fill="#115E67" font-weight="600">similar tokens &#8594; similar vectors</text>
  </g>
  <text x="60" y="312" font-size="13" font-style="italic" fill="#94A3B8">(real vectors have hundreds&#8211;thousands of dimensions)</text>

  <!-- RIGHT: meaning-space scatter -->
  <text x="470" y="146" font-size="13" font-weight="600" fill="#475569">&#8230; and similar meanings sit near each other</text>
  <rect x="470" y="158" width="440" height="262" rx="10" fill="#FBFCFD" stroke="#EEF2F6"/>
  <text x="884" y="412" font-size="11" text-anchor="end" font-style="italic" fill="#CBD5E1">2-D projection</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#1F2937">
    <!-- drinkware cluster -->
    <g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.38;0.46;0.92;1" values="0;0;1;1;0"/>
      <circle cx="560" cy="220" r="5" fill="#115E67"/><text x="570" y="225">cup</text>
      <circle cx="600" cy="240" r="5" fill="#115E67"/><text x="610" y="245">mug</text>
      <circle cx="556" cy="262" r="5" fill="#115E67"/><text x="566" y="267">glass</text>
    </g>
    <!-- animals cluster -->
    <g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.46;0.54;0.92;1" values="0;0;1;1;0"/>
      <circle cx="800" cy="350" r="5" fill="#115E67"/><text x="810" y="355">dog</text>
      <circle cx="840" cy="332" r="5" fill="#115E67"/><text x="850" y="337">cat</text>
      <circle cx="806" cy="384" r="5" fill="#115E67"/><text x="816" y="389">puppy</text>
    </g>
    <!-- days cluster -->
    <g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.54;0.62;0.92;1" values="0;0;1;1;0"/>
      <circle cx="544" cy="382" r="5" fill="#115E67"/><text x="554" y="387">Monday</text>
      <circle cx="560" cy="404" r="5" fill="#115E67"/><text x="570" y="409">Friday</text>
    </g>
  </g>
  <!-- proximity highlight on cup/mug -->
  <g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.66;0.74;0.92;1" values="0;0;1;1;0"/>
    <ellipse cx="585" cy="240" rx="62" ry="44" fill="none" stroke="#B15533" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="585" y="190" font-size="13" text-anchor="middle" fill="#B15533" font-weight="600">cup &#8776; mug</text>
  </g>

  <!-- caption -->
  <line x1="48" y1="448" x2="912" y2="448" stroke="#E2E8F0"/>
  <text x="48" y="474" font-size="15" fill="#475569">Distance &#8776; similarity &#8212; meaning lives in the geometry.</text>
  <text x="48" y="498" font-size="13" font-style="italic" fill="#94A3B8">The next layers refine each vector using the surrounding context &#8212; that&#8217;s attention.</text>
</svg>
