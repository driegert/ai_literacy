<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <!-- Forward pass, stage 5: P(NEXT TOKEN). Scores -> probabilities; sample, append, repeat. 14s loop, SMIL.
       Same example as next_token_sampling.svg ("The capital of France is" -> Paris -> "."). -->
  <defs>
    <marker id="head" markerWidth="4" markerHeight="4" refX="4" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#115E67"/>
    </marker>
  </defs>

  <text x="48" y="24" font-size="13" letter-spacing="2.5" fill="#154734" font-weight="700">HOW AN LLM WORKS &#183; P(NEXT TOKEN)</text>

  <!-- pipeline rail (P(next token) highlighted) -->
  <g font-size="13" font-weight="600">
    <rect x="48"  y="40" width="86"  height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="91"  y="58" text-anchor="middle" fill="#475569">tokens</text>
    <rect x="158" y="40" width="118" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="217" y="58" text-anchor="middle" fill="#475569">embeddings</text>
    <rect x="300" y="40" width="150" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="375" y="58" text-anchor="middle" fill="#475569">attention layers</text>
    <rect x="474" y="40" width="78"  height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="513" y="58" text-anchor="middle" fill="#475569">scores</text>
    <rect x="576" y="38" width="132" height="32" rx="6" fill="#D9E9EA" stroke="#115E67" stroke-width="2"/>
    <text x="642" y="58" text-anchor="middle" fill="#115E67">P(next token)</text>
    <g stroke="#CBD5E1" stroke-width="1.5" fill="none">
      <path d="M134,54 L156,54" marker-end="url(#head)"/>
      <path d="M276,54 L298,54" marker-end="url(#head)"/>
      <path d="M450,54 L472,54" marker-end="url(#head)"/>
      <path d="M552,54 L574,54" marker-end="url(#head)"/>
    </g>
    <rect x="576" y="38" width="132" height="32" rx="6" fill="none" stroke="#115E67" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.5;1" values="0;0.6;0"/>
      <animate attributeName="stroke-width" dur="14s" repeatCount="indefinite" keyTimes="0;0.5;1" values="2;7;2"/>
    </rect>
  </g>
  <path d="M642,72 L642,90 M636,85 L642,90 L648,85" stroke="#115E67" stroke-width="2" fill="none"/>
  <text x="48" y="108" font-size="13" font-style="italic" fill="#94A3B8">the scores become probabilities &#8212; sample one token, append it, then repeat</text>

  <!-- context -->
  <rect x="60" y="120" width="840" height="60" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="78" y="142" font-size="12" letter-spacing="2" fill="#94A3B8" font-weight="600">CONTEXT</text>
  <text x="78" y="168" font-size="24" font-family="Georgia, 'Iowan Old Style', serif" fill="#1F2937">The capital of France is</text>
  <text x="382" y="168" font-size="24" font-family="Georgia, 'Iowan Old Style', serif" fill="#115E67" font-weight="600" opacity="0"> Paris
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.30;0.33;0.93;0.96;1" values="0;0;1;1;0;0"/>
  </text>
  <text x="455" y="168" font-size="24" font-family="Georgia, 'Iowan Old Style', serif" fill="#115E67" font-weight="600" opacity="0">.
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.74;0.77;0.93;0.96;1" values="0;0;1;1;0;0"/>
  </text>

  <!-- distribution label -->
  <text x="78" y="206" font-size="17" fill="#1F2937" font-family="Georgia, 'Iowan Old Style', serif" font-style="italic">P( next token | context )</text>

  <!-- bar lane backdrop -->
  <g fill="#F8FAFC">
    <rect x="320" y="216" width="460" height="28" rx="4"/>
    <rect x="320" y="254" width="460" height="28" rx="4"/>
    <rect x="320" y="292" width="460" height="28" rx="4"/>
    <rect x="320" y="330" width="460" height="28" rx="4"/>
    <rect x="320" y="368" width="460" height="28" rx="4"/>
  </g>

  <!-- ===== STEP 1: peaked (Paris) ===== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.04;0.07;0.40;0.43;1" values="0;0;1;1;0;0"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#334155" text-anchor="end">
      <text x="300" y="235">"Paris"</text>
      <text x="300" y="273">"a"</text>
      <text x="300" y="311">"the"</text>
      <text x="300" y="349">"located"</text>
      <text x="300" y="387">"now"</text>
    </g>
    <rect x="320" y="216" height="28" rx="4" fill="#CBD5E1" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.07;0.18;0.41;0.43;1" values="0;0;419;419;0;0"/>
      <animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.21;0.25;0.41;0.43;1" values="#CBD5E1;#CBD5E1;#115E67;#115E67;#CBD5E1;#CBD5E1"/>
    </rect>
    <rect x="320" y="254" height="28" rx="4" fill="#CBD5E1" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.07;0.18;0.41;0.43;1" values="0;0;14;14;0;0"/></rect>
    <rect x="320" y="292" height="28" rx="4" fill="#CBD5E1" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.07;0.18;0.41;0.43;1" values="0;0;9;9;0;0"/></rect>
    <rect x="320" y="330" height="28" rx="4" fill="#CBD5E1" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.07;0.18;0.41;0.43;1" values="0;0;9;9;0;0"/></rect>
    <rect x="320" y="368" height="28" rx="4" fill="#CBD5E1" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.07;0.18;0.41;0.43;1" values="0;0;9;9;0;0"/></rect>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#475569" text-anchor="end">
      <text x="804" y="235">0.91</text>
      <text x="804" y="273">0.03</text>
      <text x="804" y="311">0.02</text>
      <text x="804" y="349">0.02</text>
      <text x="804" y="387">0.02</text>
    </g>
    <text x="820" y="235" font-size="13" font-weight="700" letter-spacing="1.5" fill="#B15533" opacity="0">SAMPLED &#8593;
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.24;0.27;0.41;0.43;1" values="0;0;1;1;0;0"/>
    </text>
  </g>

  <!-- ===== STEP 2: flatter (the boring token) ===== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.45;0.48;0.88;0.90;1" values="0;0;1;1;0;0"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#334155" text-anchor="end">
      <text x="300" y="235">"."</text>
      <text x="300" y="273">","</text>
      <text x="300" y="311">"and"</text>
      <text x="300" y="349">"&#8212;"</text>
      <text x="300" y="387">"in"</text>
    </g>
    <rect x="320" y="216" height="28" rx="4" fill="#CBD5E1" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.50;0.61;0.86;0.88;1" values="0;0;267;267;0;0"/>
      <animate attributeName="fill" dur="14s" repeatCount="indefinite" keyTimes="0;0.65;0.69;0.86;0.88;1" values="#CBD5E1;#CBD5E1;#115E67;#115E67;#CBD5E1;#CBD5E1"/>
    </rect>
    <rect x="320" y="254" height="28" rx="4" fill="#CBD5E1" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.50;0.61;0.86;0.88;1" values="0;0;101;101;0;0"/></rect>
    <rect x="320" y="292" height="28" rx="4" fill="#CBD5E1" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.50;0.61;0.86;0.88;1" values="0;0;55;55;0;0"/></rect>
    <rect x="320" y="330" height="28" rx="4" fill="#CBD5E1" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.50;0.61;0.86;0.88;1" values="0;0;23;23;0;0"/></rect>
    <rect x="320" y="368" height="28" rx="4" fill="#CBD5E1" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.50;0.61;0.86;0.88;1" values="0;0;14;14;0;0"/></rect>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#475569" text-anchor="end">
      <text x="804" y="235">0.58</text>
      <text x="804" y="273">0.22</text>
      <text x="804" y="311">0.12</text>
      <text x="804" y="349">0.05</text>
      <text x="804" y="387">0.03</text>
    </g>
    <text x="820" y="235" font-size="13" font-weight="700" letter-spacing="1.5" fill="#B15533" opacity="0">SAMPLED &#8593;
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.69;0.72;0.86;0.88;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="320" y="424" font-size="14" fill="#94A3B8" font-style="italic">less peaked &#8594; the model is genuinely less certain here</text>
  </g>

  <!-- caption -->
  <line x1="60" y1="470" x2="900" y2="470" stroke="#E2E8F0"/>
  <text x="60" y="496" font-size="15" fill="#475569">Generation = sample one token from this distribution, append it, then repeat &#8634;</text>
</svg>
