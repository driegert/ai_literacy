<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <!-- The 3D autonomy ladder. "you" climbs the rungs; autonomy and audit burden both rise. 12s loop, SMIL. -->
  <defs>
    <marker id="head" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#115E67"/>
    </marker>
  </defs>

  <text x="48" y="24" font-size="13" letter-spacing="2.5" fill="#154734" font-weight="700">THE 3D AUTONOMY LADDER</text>
  <text x="48" y="46" font-size="13" font-style="italic" fill="#94A3B8">more autonomy as you climb &#8212; and a bigger audit burden with every rung</text>

  <!-- autonomy axis (left) -->
  <path d="M44,438 L44,150" stroke="#115E67" stroke-width="2" fill="none" marker-end="url(#head)"/>
  <text x="26" y="300" transform="rotate(-90,26,300)" text-anchor="middle" font-size="12" letter-spacing="2" font-weight="700" fill="#115E67">AUTONOMY</text>

  <!-- staircase -->
  <path d="M70,440 L70,410 L310,410 L310,330 L530,330 L530,250 L780,250 L780,440 Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <g stroke="#115E67" stroke-width="3">
    <line x1="70" y1="410" x2="310" y2="410"/>
    <line x1="310" y1="330" x2="530" y2="330"/>
    <line x1="530" y1="250" x2="780" y2="250"/>
  </g>

  <!-- RUNG 1: Discussion -->
  <g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.27;0.34;0.90;1" values="1;1;0.5;0.5;1"/>
    <text x="86" y="312" font-size="11" letter-spacing="2" fill="#94A3B8">RUNG 1</text>
    <text x="86" y="336" font-size="21" font-weight="700" fill="#115E67">Discussion</text>
    <text x="86" y="358" font-size="14" fill="#475569">One model, back-and-forth.</text>
    <text x="86" y="376" font-size="14" fill="#475569">You do the thinking.</text>
    <text x="86" y="396" font-size="13" font-style="italic" fill="#94A3B8">e.g. &#8220;explain this&#8221;</text>
  </g>
  <!-- RUNG 2: Delegation -->
  <g opacity="0.5"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.34;0.40;0.58;0.64;1" values="0.5;0.5;1;1;0.5;0.5"/>
    <text x="326" y="232" font-size="11" letter-spacing="2" fill="#94A3B8">RUNG 2</text>
    <text x="326" y="256" font-size="21" font-weight="700" fill="#115E67">Delegation</text>
    <text x="326" y="278" font-size="14" fill="#475569">Hand off a scoped task.</text>
    <text x="326" y="296" font-size="14" fill="#475569">You review the result.</text>
    <text x="326" y="316" font-size="13" font-style="italic" fill="#94A3B8">e.g. &#8220;summarize a paper&#8221;</text>
  </g>
  <!-- RUNG 3: Distribution -->
  <g opacity="0.5"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.66;0.72;0.92;0.98;1" values="0.5;0.5;1;1;0.5;0.5"/>
    <text x="536" y="152" font-size="11" letter-spacing="2" fill="#94A3B8">RUNG 3</text>
    <text x="536" y="176" font-size="21" font-weight="700" fill="#115E67">Distribution</text>
    <text x="536" y="198" font-size="14" fill="#475569">Many runs or many agents.</text>
    <text x="536" y="216" font-size="14" fill="#475569">You oversee the process.</text>
    <text x="536" y="236" font-size="13" font-style="italic" fill="#94A3B8">e.g. agentic CLI workflows</text>
  </g>

  <!-- climbing "you" marker -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.25;0.33;0.58;0.66;0.92;1"
      values="0,0; 0,0; 230,-80; 230,-80; 470,-160; 470,-160; 0,0"/>
    <circle cx="270" cy="398" r="12" fill="#B15533"/>
    <text x="270" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#B15533">you</text>
  </g>

  <!-- audit-burden gauge (right) -->
  <text x="860" y="110" text-anchor="middle" font-size="11" letter-spacing="2" font-weight="700" fill="#B15533">AUDIT</text>
  <text x="860" y="123" text-anchor="middle" font-size="11" letter-spacing="2" font-weight="700" fill="#B15533">BURDEN</text>
  <rect x="848" y="130" width="24" height="310" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
  <rect x="848" y="370" width="24" height="70" rx="4" fill="#B15533">
    <animate attributeName="height" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.25;0.33;0.58;0.66;0.92;1" values="70;70;165;165;290;290;70"/>
    <animate attributeName="y" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.25;0.33;0.58;0.66;0.92;1" values="370;370;275;275;150;150;370"/>
  </rect>
  <text x="842" y="138" text-anchor="end" font-size="11" fill="#94A3B8">high</text>
  <text x="842" y="438" text-anchor="end" font-size="11" fill="#94A3B8">low</text>

  <!-- caption -->
  <line x1="48" y1="462" x2="900" y2="462" stroke="#E2E8F0"/>
  <text x="48" y="488" font-size="15" fill="#475569">As you climb, the model takes on more &#8212; and the audit burden climbs right along with it.</text>
  <text x="48" y="510" font-size="13" font-style="italic" fill="#94A3B8">Knowing how to verify the output is the skill that has to scale with you.</text>
</svg>
