<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <!-- Sampling temperature: same scores, reshaped by T. Slider sweeps low<->high; distribution peaked<->flat. 12s loop, SMIL. -->

  <text x="48" y="24" font-size="13" letter-spacing="2.5" fill="#154734" font-weight="700">SAMPLING TEMPERATURE</text>
  <text x="48" y="46" font-size="13" font-style="italic" fill="#94A3B8">the same scores, sampled differently &#8212; low T sharpens the distribution, high T flattens it</text>

  <!-- slider -->
  <text x="120" y="92" font-size="13" font-weight="600" fill="#475569">temperature</text>
  <rect x="120" y="104" width="640" height="6" rx="3" fill="#E2E8F0"/>
  <circle cx="120" cy="107" r="12" fill="#B15533">
    <animate attributeName="cx" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="120;440;760;440;120"/>
  </circle>
  <text x="120" y="134" font-size="12" fill="#94A3B8">low T &#183; sharper, more deterministic</text>
  <text x="760" y="134" text-anchor="end" font-size="12" fill="#94A3B8">high T &#183; flatter, more random</text>

  <!-- context -->
  <text x="120" y="172" font-size="20" font-family="Georgia, 'Iowan Old Style', serif" fill="#1F2937">&#8220;My favourite season is &#8230;&#8221;</text>

  <!-- distribution bars (reshape with T) -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#334155" text-anchor="end">
    <text x="240" y="211">summer</text>
    <text x="240" y="251">autumn</text>
    <text x="240" y="291">winter</text>
    <text x="240" y="331">spring</text>
    <text x="240" y="371">fall</text>
  </g>
  <g fill="#115E67">
    <rect x="256" y="190" height="30" rx="4" width="332"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="332;164;109;164;332"/></rect>
    <rect x="256" y="230" height="30" rx="4" width="46"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="46;92;88;92;46"/></rect>
    <rect x="256" y="270" height="30" rx="4" width="34"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="34;84;88;84;34"/></rect>
    <rect x="256" y="310" height="30" rx="4" width="8"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="8;55;76;55;8"/></rect>
    <rect x="256" y="350" height="30" rx="4" width="2"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="2;25;59;25;2"/></rect>
  </g>

  <!-- sampled output -->
  <text x="120" y="402" font-size="13" fill="#475569">if you sample one token:</text>
  <!-- low-T: deterministic -->
  <g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.38;0.45;0.58;0.65;1" values="1;1;0.12;0.12;1;1"/>
    <rect x="120" y="412" width="120" height="34" rx="6" fill="#D9E9EA" stroke="#115E67"/>
    <text x="180" y="434" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#115E67">summer</text>
    <text x="252" y="434" font-size="13" font-style="italic" fill="#94A3B8">&#8592; reliably the top pick</text>
  </g>
  <!-- high-T: variable -->
  <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.38;0.45;0.58;0.65;1" values="0;0;1;1;0;0"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#B15533" text-anchor="middle">
      <rect x="120" y="412" width="84" height="34" rx="6" fill="#F5E0D7" stroke="#E3C2B4"/><text x="162" y="434">summer</text>
      <rect x="212" y="412" width="84" height="34" rx="6" fill="#F5E0D7" stroke="#E3C2B4"/><text x="254" y="434">autumn</text>
      <rect x="304" y="412" width="84" height="34" rx="6" fill="#F5E0D7" stroke="#E3C2B4"/><text x="346" y="434">winter</text>
      <rect x="396" y="412" width="84" height="34" rx="6" fill="#F5E0D7" stroke="#E3C2B4"/><text x="438" y="434">spring</text>
    </g>
    <text x="496" y="434" font-size="13" font-style="italic" fill="#B15533">&#8592; any of these &#8212; non-deterministic</text>
  </g>

  <!-- caption -->
  <line x1="48" y1="470" x2="912" y2="470" stroke="#E2E8F0"/>
  <text x="48" y="496" font-size="15" fill="#475569">Temperature rescales the scores before softmax &#8212; lower sharpens toward the top pick, higher flattens toward random.</text>
  <text x="48" y="518" font-size="13" font-style="italic" fill="#94A3B8">That spread is also where run-to-run non-determinism comes from.</text>
</svg>
